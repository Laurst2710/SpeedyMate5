<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedyMATE — Concurs Matematică</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f13;--s1:#17171e;--s2:#1f1f28;--bd:#2a2a38;--tx:#e8e6f0;--tx2:#7a7890;--gold:#c9a84c;--gr:#2e7d32;--gr2:#81c784;--rd:#8b3d3d;--rd2:#ef9a9a;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:17px}
header{padding:.9rem 1.5rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:var(--s1);position:sticky;top:0;z-index:40}
.brand{font-size:1rem;font-weight:600}.brand em{color:var(--gold);font-style:normal}
#hdr-info{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--tx2)}
.screen{display:none;max-width:700px;margin:0 auto;padding:2rem 1.5rem}
.screen.active{display:block}
.big-title{font-size:1.8rem;font-weight:600;margin-bottom:.2rem}
.sub-title{color:var(--tx2);font-size:.85rem;font-family:'JetBrains Mono',monospace;margin-bottom:1.5rem}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:1.2rem 1.4rem;margin-bottom:1rem}
.card-title{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--gold);letter-spacing:.08em;margin-bottom:.75rem}
.info-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:1rem}
.ir{text-align:center;padding:.6rem;background:var(--s2);border-radius:6px}
.ir-l{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--tx2);letter-spacing:.08em;margin-bottom:.2rem}
.ir-v{font-size:.95rem;font-weight:600;color:var(--gold)}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);margin-bottom:.4rem;font-family:'JetBrains Mono',monospace}
.field input,.field select{width:100%;padding:.75rem 1rem;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-family:inherit;font-size:1rem;outline:none;transition:border-color .15s;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--gold)}
.field select option{background:var(--s2)}
.btn-primary{width:100%;padding:1rem;background:var(--gold);border:none;border-radius:var(--r);color:#111;font-family:'Crimson Pro',serif;font-size:1.1rem;font-weight:600;cursor:pointer}
.btn-sec{padding:.7rem 1.3rem;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-family:inherit;font-size:.95rem;cursor:pointer}
.btn-sec:hover{background:var(--bd)}
/* QUIZ */
.prog-wrap{margin-bottom:1.5rem}
.prog-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.prog-badge{font-family:'JetBrains Mono',monospace;font-size:.72rem;padding:.2rem .7rem;border-radius:20px;border:1px solid var(--gold);color:var(--gold);letter-spacing:.06em}
.prog-ctr{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--tx2)}
.prog-track{width:100%;height:3px;background:var(--s2);border-radius:2px}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s ease}
.q-nr{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--tx2);letter-spacing:.08em;margin-bottom:.6rem}
.q-text{font-size:1.1rem;line-height:1.8}
.opts{display:grid;gap:.5rem;margin:.8rem 0}
.opt{width:100%;text-align:left;padding:.9rem 1.2rem;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);cursor:pointer;font-family:'Crimson Pro',serif;font-size:1rem;line-height:1.5;transition:background .1s,border-color .1s}
.opt:hover:not(:disabled){background:var(--s2);border-color:var(--tx2)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--gr);border-color:var(--gr2);color:#fff}
.opt.wrong{background:var(--rd);border-color:var(--rd2);color:#fff}
.fb{padding:.9rem 1.1rem;border-radius:var(--r);font-size:.92rem;line-height:1.6;display:none;margin-bottom:.8rem;white-space:pre-wrap}
.fb.ok{background:#1b4d1e;border:1px solid var(--gr);color:var(--gr2)}
.fb.err{background:#4d1b1b;border:1px solid var(--rd);color:var(--rd2)}
/* RESULT */
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.5rem}
.rc{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:1rem 1.2rem}
.rc-l{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--tx2);letter-spacing:.08em;margin-bottom:.35rem}
.rc-v{font-size:1.5rem;font-weight:600}
.rc-v.gold{color:var(--gold)}.rc-v.gr{color:var(--gr2)}.rc-v.rd{color:var(--rd2)}
.rmsg{padding:1rem 1.2rem;border-radius:var(--r);font-size:.93rem;line-height:1.6;margin-bottom:1rem}
.rmsg.ok{background:#1b4d1e;border:1px solid var(--gr);color:var(--gr2)}
.rmsg.fail{background:#4d1b1b;border:1px solid var(--rd);color:var(--rd2)}
.detail-list{display:grid;gap:.35rem;margin-bottom:1.5rem}
.dl-item{display:flex;align-items:center;gap:.75rem;padding:.5rem .9rem;border-radius:6px;font-size:.88rem}
.dl-item.ok{background:#1b4d1e;color:var(--gr2)}
.dl-item.err{background:#4d1b1b;color:var(--rd2)}
.dl-nr{font-family:'JetBrains Mono',monospace;font-size:.72rem;min-width:35px}
.sec-title{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--tx2);letter-spacing:.1em;margin:.5rem 0 .6rem}
#err-start{display:none;margin-top:.75rem;padding:.75rem 1rem;background:#4d1b1b;color:var(--rd2);border:1px solid var(--rd);border-radius:var(--r);font-size:.9rem}
</style>
</head>
<body>
<header>
  <div class="brand"><em>SpeedyMATE</em> — Concurs</div>
  <div id="hdr-info"></div>
</header>

<!-- START -->
<div id="scr-start" class="screen active">
  <div class="big-title">Concursul Județean de Matematică „TOMIS”</div>
  <div class="sub-title">Etapa Locală · 15 Decembrie 2012 · Clasa a V-a</div>

  <div class="card">
    <div class="card-title">SELECTEAZĂ VARIANTA</div>
    <div class="field">
      <label>Varianta</label>
      <select id="inp-var">
        <option value="v1">Varianta 1</option>
        <option value="v2">Varianta 2</option>
        <option value="v3">Varianta 3</option>
      </select>
    </div>
    <div class="info-row">
      <div class="ir"><div class="ir-l">ITEMI</div><div class="ir-v">18</div></div>
      <div class="ir"><div class="ir-l">PUNCTAJ / ITEM</div><div class="ir-v">5 p</div></div>
      <div class="ir"><div class="ir-l">TOTAL</div><div class="ir-v">90 p</div></div>
    </div>
  </div>

  <div class="field"><label>Numele tău</label><input type="text" id="inp-n" placeholder="ex: Ion Popescu"></div>
  <div class="field"><label>Clasa</label><input type="text" id="inp-c" placeholder="ex: 5A"></div>
  <button class="btn-primary" onclick="startTest()">Începe concursul →</button>
  <div id="err-start"></div>
</div>

<!-- QUIZ -->
<div id="scr-quiz" class="screen">
  <div class="prog-wrap">
    <div class="prog-hdr">
      <span class="prog-badge" id="var-badge">VARIANTA 1</span>
      <span class="prog-ctr" id="q-ctr">1 / 18</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  </div>
  <div class="card">
    <div class="q-nr" id="q-nr">\u00cENTREBAREA 1</div>
    <div class="q-text" id="q-text"></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb"></div>
  <button class="btn-sec" id="btn-next" style="display:none" onclick="nextQ()">Următoarea →</button>
</div>

<!-- RESULT -->
<div id="scr-result" class="screen">
  <div class="big-title" style="margin-bottom:.25rem">Rezultat concurs</div>
  <div class="sub-title" id="res-sub"></div>
  <div class="res-grid">
    <div class="rc"><div class="rc-l">SCOR</div><div class="rc-v gold" id="rv-scor">-</div></div>
    <div class="rc"><div class="rc-l">PUNCTAJ</div><div class="rc-v gr" id="rv-puncte">-</div></div>
    <div class="rc"><div class="rc-l">CORECTE</div><div class="rc-v" id="rv-ok">-</div></div>
    <div class="rc"><div class="rc-l">GRE\u0218ITE</div><div class="rc-v rd" id="rv-err">-</div></div>
  </div>
  <div class="rmsg" id="res-msg"></div>
  <div class="sec-title">DETALIU RĂSPUNSURI</div>
  <div class="detail-list" id="dl"></div>
  <button class="btn-primary" onclick="resetAll()" style="margin-top:1rem">Test nou</button>
</div>

<script>
let TESTS = null;

async function loadData() {
  try {
    const res = await fetch('./data/CONCURS_TOMIS_CLS5_2012.json');
    const data = await res.json();
    TESTS = data.variante;
    // populeaza dropdown variante
    const sel = document.getElementById('sel-var');
    if(sel) { sel.innerHTML = ''; Object.entries(TESTS).forEach(([k,v]) => { const o=document.createElement('option'); o.value=k; o.textContent=v.label; sel.appendChild(o); }); }
  } catch(e) {
    document.body.innerHTML += '<div style="color:red;padding:1rem">Eroare la incarcarea datelor: '+e.message+'</div>';
  }
}
loadData();

let items=[], idx=0, score=0, results=[], varLabel='';
const labels=['a','b','c','d'];

function startTest(){
  const n=document.getElementById('inp-n').value.trim();
  const c=document.getElementById('inp-c').value.trim();
  const vid=document.getElementById('inp-var').value;
  if(!n||!c){showErr('Completează numele și clasa!');return}
  const t=TESTS[vid];
  items=t.items; varLabel=t.label;
  idx=0;score=0;results=[];
  document.getElementById('hdr-info').textContent=n+' · '+c+' · '+varLabel;
  document.getElementById('var-badge').textContent=varLabel.toUpperCase();
  show('scr-quiz');renderQ();
}

function renderQ(){
  const q=items[idx];
  const pct=Math.round(idx/items.length*100);
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('q-ctr').textContent=(idx+1)+' / '+items.length;
  document.getElementById('q-nr').textContent='ÎNTREBAREA '+q.nr;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('fb').style.display='none';
  document.getElementById('btn-next').style.display='none';
  const el=document.getElementById('opts');el.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=()=>answer(q,i);el.appendChild(b);
  });
}

function answer(q,i){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ok=i===q.ok;
  if(ok)score++;
  results.push({nr:q.nr,ok,chosen:q.opts[i],right:q.opts[q.ok]});
  document.querySelectorAll('.opt')[i].classList.add(ok?'correct':'wrong');
  document.querySelectorAll('.opt')[q.ok].classList.add('correct');
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'ok':'err');
  fb.textContent=ok?q.exOk:q.exGr;
  fb.style.display='block';
  document.getElementById('btn-next').style.display='inline-block';
}

function nextQ(){
  idx++;
  if(idx>=items.length){showResult();}
  else{renderQ();}
}

function showResult(){
  const total=score*5, pct=Math.round(score/items.length*100);
  document.getElementById('res-sub').textContent=
    document.getElementById('inp-n').value+' · '+document.getElementById('inp-c').value+' · '+varLabel;
  document.getElementById('rv-scor').textContent=score+' / '+items.length+' ('+pct+'%)';
  document.getElementById('rv-puncte').textContent=total+' / 90p';
  document.getElementById('rv-ok').textContent=score;
  document.getElementById('rv-err').textContent=items.length-score;
  const msg=document.getElementById('res-msg');
  if(pct>=80){msg.className='rmsg ok';msg.textContent='Felicitări! Rezultat excelenț.';}
  else if(pct>=50){msg.className='rmsg ok';msg.textContent='Rezultat bun. Continuă antrenamentul!';}
  else{msg.className='rmsg fail';msg.textContent='Revizuiește și reia.';}
  const dl=document.getElementById('dl');dl.innerHTML='';
  results.forEach(r=>{
    const d=document.createElement('div');d.className='dl-item '+(r.ok?'ok':'err');
    d.innerHTML=`<span class="dl-nr">Q${r.nr}</span><span>${r.ok?'\u2713':('\u2717 → '+r.right)}</span>`;
    dl.appendChild(d);
  });
  show('scr-result');
}

function resetAll(){
  document.getElementById('inp-n').value='';document.getElementById('inp-c').value='';
  document.getElementById('hdr-info').textContent='';show('scr-start');
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function showErr(msg){const el=document.getElementById('err-start');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}
</script>
</body>
</html>
