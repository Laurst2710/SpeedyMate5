<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedyMATE — Olimpiadă</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderAll()"></script>
<style>
:root{
  --bg:#0f1117;
  --surface:#16191f;
  --card:#1c2028;
  --border:#272c38;
  --gold:#e8b84b;
  --text:#f0f2f8;
  --muted:#9098b0;
  --radius:10px;
  --font:'Georgia',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}

header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:1rem 2rem;display:flex;align-items:center;gap:1rem;
}
.logo{font-size:1.5rem;font-weight:900;letter-spacing:-.01em;}
.logo span{color:var(--gold);}
.badge{
  border:1px solid var(--gold);color:var(--gold);
  padding:.2rem .65rem;border-radius:4px;font-size:.7rem;letter-spacing:.08em;
}

.nav{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:.8rem 2rem;display:flex;gap:1.5rem;align-items:center;
}
.nav label{color:var(--muted);font-size:.82rem;}
select{
  background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:6px;
  padding:.35rem .8rem;font-size:.85rem;font-family:var(--font);cursor:pointer;
}
.score-pill{
  margin-left:auto;font-size:.88rem;font-weight:700;
  color:var(--gold);letter-spacing:.03em;
}

.container{max-width:820px;margin:2rem auto;padding:0 1.5rem 5rem;}

/* SCOREBOARD */
.scoreboard{
  display:flex;gap:2rem;align-items:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.9rem 1.3rem;
  margin-bottom:1.5rem;flex-wrap:wrap;
}
.sc-item{display:flex;flex-direction:column;gap:.1rem;}
.sc-label{font-size:.65rem;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;}
.sc-val{font-size:1.2rem;font-weight:700;color:var(--gold);}
.prog-wrap{flex:1;min-width:120px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:.5rem;}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;width:0%;}

/* INTRO */
.intro{
  font-size:.88rem;line-height:1.7;color:var(--muted);
  padding:.8rem 1.2rem;margin-bottom:1.5rem;
  border-left:2px solid var(--border);
}
.intro strong{color:var(--text);}

/* PROBLEMA */
.problema{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:1.2rem;overflow:hidden;
}
.prob-header{
  padding:.8rem 1.3rem;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.prob-title{font-size:.9rem;font-weight:700;color:var(--gold);letter-spacing:.04em;}
.prob-pts{font-size:.8rem;color:var(--muted);}
.enunt{
  padding:1.1rem 1.3rem;font-size:.95rem;line-height:1.85;
  white-space:pre-line;border-bottom:1px solid var(--border);
}

/* SUBPUNCT */
.sub-block{border-bottom:1px solid var(--border);}
.sub-block:last-child{border-bottom:none;}

.sub-header{
  padding:.75rem 1.3rem;
  display:flex;justify-content:space-between;align-items:center;
}
.sub-id{font-size:.8rem;color:var(--muted);letter-spacing:.05em;}
.sub-status{font-size:.78rem;color:var(--muted);}

/* BUTON PRINCIPAL */
.actiuni{padding:0 1.3rem .9rem;}
.indemn{font-size:.82rem;color:var(--muted);margin-bottom:.6rem;}
.btn-sol{
  background:var(--gold);color:#0f1117;border:none;
  padding:.55rem 1.3rem;border-radius:6px;
  cursor:pointer;font-size:.88rem;font-weight:700;
  font-family:var(--font);transition:opacity .15s;
}
.btn-sol:hover{opacity:.85;}

/* SOLUTIE */
.sol-panel{display:none;border-top:1px solid var(--border);}
.sol-panel.viz{display:block;}

.sol-sectiune{padding:.9rem 1.3rem;border-bottom:1px solid var(--border);}
.sol-sectiune:last-child{border-bottom:none;}
.sol-label{
  font-size:.65rem;color:var(--muted);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:.5rem;
}
.sol-text{font-size:.9rem;line-height:1.75;}

.pas-row{
  display:flex;gap:.75rem;padding:.38rem 0;
  border-bottom:1px solid rgba(255,255,255,.04);align-items:flex-start;
}
.pas-row:last-child{border-bottom:none;}
.pas-p{
  min-width:30px;text-align:center;
  border:1px solid var(--border);color:var(--gold);
  border-radius:4px;padding:.1rem .25rem;
  font-size:.7rem;font-weight:700;flex-shrink:0;margin-top:3px;
}
.pas-t{font-size:.86rem;line-height:1.65;}

.sol-alt{
  padding:.7rem 1rem;margin:.5rem 1.3rem;
  border-left:2px solid var(--border);
  font-size:.84rem;line-height:1.65;color:var(--muted);
}
.sol-alt-label{font-size:.65rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.3rem;color:var(--muted);}

/* AUTOEVALUARE */
.eval-btns{display:none;padding:.9rem 1.3rem 1.1rem;border-top:1px solid var(--border);}
.eval-btns.viz{display:block;}
.eval-intro{font-size:.8rem;color:var(--muted);margin-bottom:.7rem;}
.btns-row{display:flex;gap:.6rem;}

.btn-ev{
  flex:1;padding:.65rem .4rem;
  background:transparent;border:1px solid var(--border);
  color:var(--text);border-radius:6px;cursor:pointer;
  font-size:.85rem;font-weight:700;font-family:var(--font);
  transition:all .15s;
}
.btn-ev:hover{border-color:var(--gold);color:var(--gold);}
.btn-ev.activ{background:var(--gold);border-color:var(--gold);color:#0f1117;}

.pct-info{
  font-size:.75rem;color:var(--muted);
  margin-top:.6rem;text-align:center;letter-spacing:.02em;
}
</style>
</head>
<body>

<header>
  <div class="logo">Speedy<span>MATE</span></div>
  <div class="badge">OLIMPIADĂ</div>
</header>

<div class="nav">
  <label>An:</label>
  <select id="selAn" onchange="incarca()">
    <option value="2013">2013</option>
    <option value="2014">2014</option>
  </select>
  <span style="color:var(--muted);font-size:.8rem">Etapa Județeană · Clasa a V-a · 28 puncte</span>
  <div class="score-pill" id="scorePill">0 / 28 p</div>
</div>

<div class="container">

  <div class="intro">
    <strong>Rezolvă fiecare subpunct pe hârtie.</strong>
    Când ești gata, apasă „Gata — vezi soluția". Vei vedea strategia de gândire, răspunsul oficial și baremul.
    Apoi autoevaluează-te sincer.
  </div>

  <div class="scoreboard">
    <div class="sc-item"><div class="sc-label">Puncte</div><div class="sc-val" id="scPct">0</div></div>
    <div class="sc-item"><div class="sc-label">Am avut ideea</div><div class="sc-val" id="scI">0</div></div>
    <div class="sc-item"><div class="sc-label">Corect</div><div class="sc-val" id="scC">0</div></div>
    <div class="sc-item"><div class="sc-label">De revăzut</div><div class="sc-val" id="scR">0</div></div>
    <div class="sc-item" style="flex:1">
      <div class="sc-label">Progres</div>
      <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
    </div>
  </div>

  <div id="main"></div>
</div>

<script>
let OLIMPIADE = {};

async function loadData() {
  try {
    const [r2013, r2014] = await Promise.all([
      fetch('./data/OLIMPIADA_JUD_V_2013.json'),
      fetch('./data/OLIMPIADA_JUD_V_2014.json')
    ]);
    const [d2013, d2014] = await Promise.all([r2013.json(), r2014.json()]);
    OLIMPIADE['2013'] = d2013;
    OLIMPIADE['2014'] = d2014;
    incarca();
  } catch(e) {
    document.body.innerHTML += '<div style="color:red;padding:1rem">Eroare: '+e.message+'</div>';
  }
}
loadData();

let stare = {};
let totalSub = 0;

function renderAll(){
  if(typeof renderMathInElement==='undefined') return;
  renderMathInElement(document.body,{
    delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],
    throwOnError:false
  });
}

function incarca(){
  const an = document.getElementById('selAn').value;
  const olimp = OLIMPIADE[an];
  stare = {};
  totalSub = olimp.probleme.reduce((s,p)=>s+p.subpuncte.length,0);
  updateScore();

  let html = '';
  olimp.probleme.forEach(prob => {
    html += `<div class="problema">
      <div class="prob-header">
        <div class="prob-title">PROBLEMA ${prob.nr}</div>
        <div class="prob-pts">${prob.punctaj_total} puncte</div>
      </div>
      <div class="enunt">${prob.enunt}</div>`;

    prob.subpuncte.forEach(sub => {
      const uid = `${an}_${sub.id}`;
      const maxPct = sub.punctaj;
      const ideiPct = Math.floor(0.6 * maxPct);

      const baremHtml = (sub.solutie||[]).filter(p=>p.punctaj>0).map(p=>
        `<div class="pas-row"><div class="pas-p">${p.punctaj}p</div><div class="pas-t">${p.pas}</div></div>`
      ).join('');

      const altHtml = sub.solutie_alternativa ? `
        <div class="sol-alt">
          <div class="sol-alt-label">Soluție alternativă — ${sub.solutie_alternativa.punctaj}</div>
          ${sub.solutie_alternativa.descriere}
        </div>` : '';

      const notaHtml = sub.nota ? `
        <div class="sol-alt">
          <div class="sol-alt-label">Notă barem</div>
          ${sub.nota}
        </div>` : '';

      html += `
      <div class="sub-block" id="block_${uid}">
        <div class="sub-header">
          <span class="sub-id">Subpunctul ${sub.id.replace(/^\d+/,'').toUpperCase() || sub.id} · ${maxPct}p</span>
          <span class="sub-status" id="status_${uid}"></span>
        </div>

        <div class="actiuni" id="actiuni_${uid}">
          <div class="indemn">Rezolvă pe hârtie, apoi:</div>
          <button class="btn-sol" onclick="arataSol('${uid}')">Gata — vezi soluția →</button>
        </div>

        <div class="sol-panel" id="sol_${uid}">
          <div class="sol-sectiune">
            <div class="sol-label">Strategia de gândire</div>
            <div class="sol-text">${sub.strategie_gandire}</div>
          </div>
          <div class="sol-sectiune">
            <div class="sol-label">Răspuns final</div>
            <div class="sol-text">${sub.raspuns_final}</div>
          </div>
          <div class="sol-sectiune">
            <div class="sol-label">Barem pas cu pas</div>
            ${baremHtml}
          </div>
          ${altHtml}
          ${notaHtml}
        </div>

        <div class="eval-btns" id="evbtns_${uid}">
          <div class="eval-intro">Autoevaluează-te — și fii complet sincer cu tine. Nimeni altcineva nu vede răspunsul tău. Autoevaluarea corectă este ea însăși o abilitate care se învață și care face diferența între progres real și progres imaginar.</div>
          <div class="btns-row">
            <button class="btn-ev" id="bi_${uid}" onclick="marcheaza('${uid}','idee',${ideiPct})">◑ Am avut ideea</button>
            <button class="btn-ev" id="bc_${uid}" onclick="marcheaza('${uid}','corect',${maxPct})">✓ Corect</button>
            <button class="btn-ev" id="br_${uid}" onclick="marcheaza('${uid}','revaz',0)">↺ De revăzut</button>
          </div>
          <div class="pct-info">Am avut ideea = ${ideiPct}p &nbsp;·&nbsp; Corect = ${maxPct}p &nbsp;·&nbsp; De revăzut = 0p</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('main').innerHTML = html;
  setTimeout(renderAll, 150);
}

function arataSol(uid){
  document.getElementById(`sol_${uid}`).classList.add('viz');
  document.getElementById(`evbtns_${uid}`).classList.add('viz');
  document.getElementById(`actiuni_${uid}`).style.display='none';
  renderAll();
}

function marcheaza(uid, tip, puncte){
  stare[uid] = {tip, puncte};
  ['bi','bc','br'].forEach(p=>document.getElementById(`${p}_${uid}`).classList.remove('activ'));
  const map={idee:'bi',corect:'bc',revaz:'br'};
  document.getElementById(`${map[tip]}_${uid}`).classList.add('activ');
  const labels={idee:'◑ Am avut ideea',corect:'✓ Corect',revaz:'↺ De revăzut'};
  document.getElementById(`status_${uid}`).textContent = labels[tip];
  updateScore();
}

function updateScore(){
  const vals = Object.values(stare);
  const pct = vals.reduce((s,v)=>s+v.puncte,0);
  document.getElementById('scPct').textContent = pct;
  document.getElementById('scI').textContent = vals.filter(v=>v.tip==='idee').length;
  document.getElementById('scC').textContent = vals.filter(v=>v.tip==='corect').length;
  document.getElementById('scR').textContent = vals.filter(v=>v.tip==='revaz').length;
  document.getElementById('scorePill').textContent = `${pct} / 28 p`;
  document.getElementById('progFill').style.width = Math.round((pct/28)*100)+'%';
}

// incarca() chemat de loadData()
</script>
</body>
</html>
